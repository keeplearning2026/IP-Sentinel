name: Lite Static Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shell-and-timer-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Bash syntax checks
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n core/daily.sh
          bash -n core/runner.sh
          bash -n core/mod_google.sh
          bash -n core/updater.sh
          bash -n core/tg_report.sh
          bash -n core/uninstall.sh

      - name: Lite timer assertions
        run: |
          set -euo pipefail

          grep -q '"daily.sh"' install.sh
          grep -q 'ExecStart=/bin/bash ${INSTALL_DIR}/core/daily.sh' install.sh
          grep -q 'OnCalendar=\*-\*-\* 04:30:00 UTC' install.sh

          ! grep -q 'enable --now ip-sentinel-data.timer' install.sh
          ! grep -q 'cat > /etc/systemd/system/ip-sentinel-data.service' install.sh
          ! grep -q 'cat > /etc/systemd/system/ip-sentinel-data.timer' install.sh

          grep -q 'DATA_UPDATE_SUMMARY' core/updater.sh
          grep -q 'render_data_update_line' core/tg_report.sh

      - name: Telegram setup assertions
        run: |
          set -euo pipefail
          grep -q '^configure_telegram$' install.sh
          grep -q '^tg_manual_chat_id()' install.sh
          grep -q 'read -rs' install.sh
          grep -q 'getUpdates' install.sh
          grep -q 'getWebhookInfo' install.sh
          grep -q 'save_config_atomic << EOF' install.sh
          ! grep -q 'deleteWebhook' install.sh
          ! grep -q 'grep.*"ok"' install.sh
          version=$(cut -d= -f2 version.txt | tr -d '[:space:]')
          grep -Fq "TARGET_VERSION=\${TARGET_VERSION:-\"$version\"}" install.sh

      - name: Telegram discovery and manual fallback tests
        run: |
          set -euo pipefail
          command -v jq
          python3 -B -m unittest discover -s tests -p 'test_telegram_setup.py' -v
